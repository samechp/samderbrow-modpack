# Regenera manifest.json cada vez que se sube algo, para que el launcher lo vea.
name: Actualizar manifest

on:
  push:
    branches: [main]
    paths-ignore: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar manifest.json
        run: python .herramientas/generar_manifest.py .
        env:
          APPDATA: /tmp  # ajustes.py lo pide; aquí no se usa
      - name: Subir manifest.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then echo "manifest.json sin cambios"; else
            git commit -m "Actualiza manifest.json"
            git push
          fi
